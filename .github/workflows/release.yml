# Builds the standalone client and attaches it to a GitHub release.
# Trigger: push a version tag, e.g.
#   git tag v1.0.0 && git push origin v1.0.0
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run smoke tests
        run: python tests/smoke_test.py

      - name: Build exe
        run: python -m PyInstaller --clean --noconfirm find_the_needle_saves.spec

      - name: Create release with exe
        uses: softprops/action-gh-release@v2
        with:
          files: dist/find-the-needle-saves.exe
          generate_release_notes: true
